[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-radiomics"
version = "0.2.0"
description = "Audited CT radiomics, foundation and hybrid image models for lung cancer subtype research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2", "pandas>=2.2,<3", "scikit-learn>=1.5,<1.9",
  "imbalanced-learn>=0.12,<0.15", "catboost>=1.2,<1.3", "joblib>=1.4,<2",
  "streamlit>=1.49,<2", "matplotlib>=3.8,<4", "pyyaml>=6,<7",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "plotly>=5,<8",
]

[project.optional-dependencies]
imaging = ["SimpleITK>=2.3,<3", "pyradiomics==3.0.1"]
dev = ["pytest>=8,<10", "pymupdf>=1.24", "httpx>=0.27,<1"]
advanced = ["tabicl==2.0.3", "torch>=2.9,<3", "torchvision>=0.24,<0.30"]
recurrence = ["scipy>=1.13,<2"]

[project.scripts]
lung-ml = "lungml.cli:main"

[tool.setuptools.packages.find]
include = ["lungml*"]

[tool.setuptools.package-data]
lungml = ["configs/*.yaml", "assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
